# Render Blueprint — the Next.js analysis dashboard.
#
# The replay results are committed to the repo, so the dashboard needs no
# database and no RPC access at runtime. `next start` reads PORT from the
# environment, which is what Render injects.
services:
  - type: web
    name: solana-replay-engine
    runtime: node
    plan: free
    region: oregon
    branch: main
    # `npm ci` refuses to run: the lockfile was generated on Windows and so
    # omits the Linux-only optional deps (@emnapi/*) that npm resolves here.
    # `npm install` reconciles that instead of failing the build.
    # --include=dev because tailwindcss/postcss are devDependencies that the
    # Next build needs, and NODE_ENV=production would otherwise skip them.
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # The free plan has 512 MB; without a cap the Next build can be
      # OOM-killed, which leaves no process listening and no open port.
      # engines only says >=20, so Render otherwise picks the newest Node
      # (26.x), which this Next version is not tested against.
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=460

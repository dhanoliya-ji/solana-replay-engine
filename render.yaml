# Render Blueprint — the Next.js analysis dashboard.
#
# The replay results are committed to the repo, so the dashboard needs no
# database and no RPC access at runtime. `next start` reads PORT from the
# environment, which is what Render injects.
services:
  - type: web
    name: solana-replay-engine
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # The free plan has 512 MB; without a cap the Next build can be
      # OOM-killed, which leaves no process listening and no open port.
      - key: NODE_OPTIONS
        value: --max-old-space-size=460

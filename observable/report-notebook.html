  <script type="application/vnd.observable.javascript" id="12">
    md`# Copying a Solana wallet is a latency problem

    **What this report answers.** If you mirror a profitable pump.fun wallet trade for
    trade, one slot behind, do you make money? And if not, is the fix better exit
    rules or something else entirely?

    The engine replays ${metrics.dataset.tradeCount.toLocaleString()} real bonding-curve
    trades across ${metrics.dataset.tokenCount} tokens, mirrors every buy made by wallet
    \`${metrics.dataset.targetWallet.slice(0, 8)}...\`, and runs a layered exit model
    against each position. Nothing is broadcast; all fills are computed in memory
    against the bonding-curve reserves recorded in the dataset.

    **The short answer: no, and the exits are not the problem.** The baseline strategy
    loses ${sol(base.totalPnl)} over ${base.trades} round trips. Every one of the
    ${metrics.grid.length} take-profit / stop-loss combinations tested also loses money.
    But filling at the target wallet's *own* price instead of one slot later turns the
    same ${base.trades} trades into ${sol(latency.counterfactualPnl)} — a swing of
    ${Math.abs(latency.latencyCost).toFixed(2)} SOL that no exit parameter recovers.`
  </script>

  </script>

  <script type="application/vnd.observable.javascript" id="23">
    md`### The same answer from every other knob

    Trailing stop, maximum hold time, and the market-cap entry window were swept
    independently. Holding time barely registers: the median position lives
    ${base.medianHoldSec.toFixed(1)} seconds, so any cap above a minute is inert. The
    market-cap window is the only filter that materially helps, and it helps by
    *trading less* — restricting entries to sub-10 SOL market caps cuts the loss to
    ${sol(subTenWindow.totalPnl)} by skipping
    ${base.trades - subTenWindow.trades} of the
    ${base.trades} entries. Avoiding a losing bet is not the same as finding a winning one.`
  </script>

  <script type="application/vnd.observable.javascript" id="25">
    md`## The actual cause: you buy after the person you are copying

    The engine fills on the next slot after the target wallet's transaction — roughly
    400 ms on Solana, and the honest assumption for any copy bot that has to observe a
    trade before reacting to it. On a bonding curve, that gap is not noise. The target's
    own buy moves the curve, and so does everyone else reacting to the same signal.

    Across ${latency.tradeCount} positions, **${latency.adverseCount} filled at a worse
    price than the wallet being copied.** The median entry pays
    ${pct(latency.medianSlippagePct)} more market cap, and the tail reaches
    ${pct(latency.p90SlippagePct)}.`
  </script>

  <script type="application/vnd.observable.javascript" id="29">

    ${(base.capitalDeployed / base.trades).toFixed(2)} SOL. It is roughly

  <script type="application/vnd.observable.javascript" id="30">
    md`## Conclusions

    1. **Mirroring this wallet one slot late loses money** — ${sol(base.totalPnl)} over
       ${base.trades} round trips, ${pct(base.winRate)} win rate, profit factor
       ${base.profitFactor.toFixed(2)}.
    2. **Exit tuning does not rescue it.** All ${metrics.grid.length} take-profit /
       stop-loss combinations lose; so does every trailing-stop and hold-time setting
       tested. The best cell still loses ${sol(metrics.best.params.totalPnl)}.
    3. **The cost is at entry, not exit.** ${latency.adverseCount}/${latency.tradeCount}
       fills are adverse, median ${pct(latency.medianSlippagePct)} worse market cap,
       costing ${Math.abs(latency.latencyCost).toFixed(2)} SOL.
    4. **The same trades at the target's price make ${sol(latency.counterfactualPnl)}.**
       The wallet's selection is genuinely profitable; the copying is what destroys it.
    5. **Therefore the engineering problem is execution latency** — co-location, a
       direct transaction feed, priority fees — not another risk parameter. A copy
       strategy evaluated without modelling entry delay will look profitable and fail
       in production.

    ## Caveats

    - One target wallet, ${metrics.dataset.tokenCount} tokens,
      ${metrics.dataset.tradeCount.toLocaleString()} trades. Findings describe this
      sample, not pump.fun in general.
    - Fees are modelled at a flat ${metrics.dataset.feeRate * 100}% per side. Priority
      fees, tips and failed transactions are not modelled, all of which make the real
      result worse, not better.
    - Fills assume the replayed reserves absorb the simulated size without additional
      impact beyond the curve maths. Competing copy bots reacting to the same signal
      are not simulated — again a cost that is understated here.
    - The zero-latency counterfactual is a bound, not an achievable target: it assumes
      a fill in the same slot at the same price, which no observer-and-react bot gets.
